<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="一个支持键盘、滑动、撤销和自动保存的经典 2048 小游戏。"
    />
    <meta name="theme-color" content="#f6f1e7" />
    <title>2048 · 数字合并小游戏</title>
    <style>
:root {
  color-scheme: light;
  --page: #f5f0e6;
  --ink: #2f322d;
  --muted: #777a72;
  --card: rgba(255, 253, 249, 0.74);
  --line: rgba(68, 70, 63, 0.1);
  --board: #b8afa1;
  --empty-cell: rgba(255, 255, 255, 0.19);
  --accent: #3f6e58;
  --accent-deep: #315344;
  --accent-soft: #dfeade;
  --gap: clamp(8px, 2.1vw, 13px);
  --radius: clamp(13px, 3vw, 20px);
  --shadow: 0 24px 70px rgba(72, 64, 49, 0.12),
    0 4px 16px rgba(72, 64, 49, 0.06);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 300px;
  background: var(--page);
}

body {
  min-height: 100svh;
  margin: 0;
  overflow-x: hidden;
  display: grid;
  place-items: center;
  padding: clamp(20px, 5vw, 52px) clamp(14px, 4vw, 32px);
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 0%, rgba(224, 237, 218, 0.92), transparent 34%),
    radial-gradient(circle at 94% 95%, rgba(238, 217, 188, 0.72), transparent 33%),
    linear-gradient(145deg, #f8f4ec 0%, #f1eadf 100%);
  font-family:
    "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system,
    sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.24;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 3px solid rgba(63, 110, 88, 0.32);
  outline-offset: 3px;
}

.ambient {
  position: fixed;
  z-index: -1;
  border: 1px solid rgba(255, 255, 255, 0.52);
  border-radius: 50%;
  pointer-events: none;
}

.ambient-one {
  width: 310px;
  height: 310px;
  top: -165px;
  right: 4vw;
  box-shadow: inset 0 0 0 40px rgba(255, 255, 255, 0.08);
}

.ambient-two {
  width: 220px;
  height: 220px;
  bottom: -125px;
  left: 5vw;
  box-shadow: inset 0 0 0 28px rgba(255, 255, 255, 0.1);
}

.app-shell {
  width: min(100%, 610px);
  animation: page-arrive 520ms cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin: 0 4px clamp(20px, 4vw, 30px);
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 3px;
  color: var(--accent);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
}

.eyebrow span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px rgba(63, 110, 88, 0.12);
}

h1 {
  margin: 0;
  font-family: "Arial Black", "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: clamp(54px, 12vw, 82px);
  line-height: 0.92;
  letter-spacing: -0.075em;
  color: #31342f;
}

.tagline {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: clamp(12px, 2.7vw, 14px);
  letter-spacing: 0.025em;
}

.scoreboard {
  display: grid;
  grid-template-columns: repeat(2, minmax(82px, 1fr));
  gap: 8px;
  flex: 0 0 auto;
}

.score-box {
  position: relative;
  min-width: 82px;
  padding: 11px 14px 10px;
  overflow: visible;
  border: 1px solid rgba(72, 74, 67, 0.08);
  border-radius: 15px;
  text-align: center;
  background: rgba(255, 255, 255, 0.58);
  box-shadow: 0 8px 22px rgba(80, 73, 59, 0.06);
}

.score-main {
  color: #fff;
  border-color: transparent;
  background: linear-gradient(145deg, #4d7d64, #365f4b);
  box-shadow: 0 10px 25px rgba(50, 91, 70, 0.19);
}

.score-label {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.score-main .score-label {
  color: rgba(255, 255, 255, 0.68);
}

.score-box strong {
  display: block;
  min-width: 54px;
  font-size: clamp(18px, 4vw, 23px);
  font-variant-numeric: tabular-nums;
  line-height: 1.08;
  letter-spacing: -0.04em;
}

.score-gain-layer {
  position: absolute;
  top: 1px;
  left: 50%;
  z-index: 4;
  pointer-events: none;
}

.score-gain {
  position: absolute;
  transform: translate(-50%, 0);
  color: var(--accent-deep);
  font-size: 16px;
  font-weight: 900;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
  animation: score-rise 760ms ease-out forwards;
}

.game-card {
  padding: clamp(13px, 3.5vw, 20px);
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: clamp(24px, 6vw, 34px);
  background: var(--card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.toolbar {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 0 2px clamp(13px, 3vw, 18px);
}

.actions {
  display: flex;
  gap: 8px;
}

.button {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border: 0;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
  transition:
    transform 130ms ease,
    background-color 130ms ease,
    box-shadow 130ms ease,
    opacity 130ms ease;
}

.button svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.button:active:not(:disabled) {
  transform: translateY(1px) scale(0.98);
}

.button-primary {
  color: #fff;
  background: var(--accent);
  box-shadow: 0 7px 15px rgba(49, 91, 70, 0.18);
}

.button-primary:hover {
  background: var(--accent-deep);
}

.button-quiet {
  color: #54584f;
  background: rgba(65, 72, 64, 0.07);
}

.button-quiet:hover:not(:disabled) {
  background: rgba(65, 72, 64, 0.11);
}

.button:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

.button-light {
  color: var(--accent-deep);
  background: var(--accent-soft);
}

.keyboard-hint {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
}

.key-cluster {
  display: grid;
  justify-items: center;
  gap: 2px;
}

.key-cluster > span {
  display: flex;
  gap: 2px;
}

kbd {
  width: 18px;
  height: 17px;
  display: inline-grid;
  place-items: center;
  border: 1px solid rgba(61, 65, 58, 0.12);
  border-bottom-color: rgba(61, 65, 58, 0.2);
  border-radius: 4px;
  color: #686c63;
  background: rgba(255, 255, 255, 0.7);
  box-shadow: 0 1px 0 rgba(61, 65, 58, 0.12);
  font-family: inherit;
  font-size: 8px;
  font-weight: 800;
}

.hint-copy {
  max-width: 42px;
  font-size: 10px;
  line-height: 1.25;
}

.board {
  --gap: clamp(8px, 2.1vw, 13px);
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  padding: var(--gap);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: var(--radius);
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 42%),
    var(--board);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.22),
    0 11px 26px rgba(82, 72, 56, 0.12);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.grid-background {
  position: absolute;
  inset: var(--gap);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
}

.grid-cell {
  border-radius: clamp(9px, 2vw, 13px);
  background: var(--empty-cell);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.tile-layer {
  position: absolute;
  inset: var(--gap);
  pointer-events: none;
}

.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: clamp(9px, 2vw, 13px);
  color: #776e65;
  background: #eee4da;
  box-shadow:
    0 5px 10px rgba(77, 67, 52, 0.12),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
  font-family: "Arial Black", "Segoe UI", "Microsoft YaHei", sans-serif;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.07em;
  will-change: left, top;
  transition:
    left 130ms cubic-bezier(0.2, 0.75, 0.3, 1),
    top 130ms cubic-bezier(0.2, 0.75, 0.3, 1),
    background-color 120ms ease,
    color 120ms ease;
}

.tile-layer.is-resizing .tile {
  transition: none;
}

.tile[data-value="2"] {
  background: #eee6db;
}

.tile[data-value="4"] {
  background: #ece0c9;
}

.tile[data-value="8"] {
  color: #fffaf5;
  background: #efac73;
}

.tile[data-value="16"] {
  color: #fffaf5;
  background: #ea9163;
}

.tile[data-value="32"] {
  color: #fffaf5;
  background: #ef775b;
}

.tile[data-value="64"] {
  color: #fffaf5;
  background: #e85c3f;
  box-shadow:
    0 6px 14px rgba(207, 76, 48, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

.tile[data-value="128"] {
  color: #fffdf5;
  background: #e8c35b;
  box-shadow:
    0 6px 15px rgba(183, 139, 28, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.tile[data-value="256"] {
  color: #fff;
  background: #e6b944;
  box-shadow:
    0 0 20px rgba(235, 189, 69, 0.36),
    0 6px 15px rgba(169, 122, 14, 0.25);
}

.tile[data-value="512"] {
  color: #fff;
  background: #dda927;
  box-shadow:
    0 0 23px rgba(235, 189, 69, 0.42),
    0 6px 15px rgba(151, 104, 4, 0.27);
}

.tile[data-value="1024"] {
  color: #fff;
  background: #c68f20;
  box-shadow:
    0 0 28px rgba(235, 189, 69, 0.5),
    0 7px 17px rgba(139, 94, 4, 0.3);
}

.tile[data-value="2048"] {
  color: #fff;
  background: linear-gradient(145deg, #dba533, #bc7d16);
  box-shadow:
    0 0 32px rgba(237, 188, 55, 0.7),
    0 8px 19px rgba(126, 80, 3, 0.34);
}

.tile.higher {
  color: #fff;
  background: linear-gradient(145deg, #496d5a, #2f4f3f);
  box-shadow:
    0 0 24px rgba(63, 110, 88, 0.32),
    0 7px 17px rgba(39, 76, 59, 0.25);
}

.tile.size-small {
  font-size: clamp(18px, 5.4vw, 32px);
  letter-spacing: -0.08em;
}

.tile.size-medium {
  font-size: clamp(16px, 4.8vw, 28px);
  letter-spacing: -0.09em;
}

.tile.size-tiny {
  font-size: clamp(13px, 3.8vw, 23px);
  letter-spacing: -0.1em;
}

.tile.spawn {
  animation: tile-spawn 180ms cubic-bezier(0.2, 0.9, 0.35, 1.25) both;
}

.tile.merged {
  animation: tile-merge 210ms cubic-bezier(0.2, 0.9, 0.35, 1.25) both;
}

.tile.consumed {
  z-index: 2;
  opacity: 0;
  transform: scale(0.72);
  transition:
    left 100ms ease,
    top 100ms ease,
    opacity 100ms ease,
    transform 100ms ease;
}

.notice {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: clamp(18px, 5vw, 34px);
  border-radius: var(--radius);
  background: rgba(53, 55, 50, 0.48);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  animation: notice-fade 180ms ease both;
}

.notice[hidden] {
  display: none;
}

.notice-card {
  width: min(100%, 340px);
  padding: clamp(21px, 5vw, 30px);
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 22px;
  text-align: center;
  background: rgba(255, 252, 246, 0.96);
  box-shadow: 0 22px 60px rgba(36, 39, 33, 0.26);
  animation: card-arrive 260ms cubic-bezier(0.2, 0.9, 0.35, 1.12) both;
}

.notice-kicker {
  margin: 0 0 4px;
  color: var(--accent);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 0.2em;
}

.notice-card h2 {
  margin: 0;
  font-size: clamp(25px, 6vw, 36px);
  line-height: 1.15;
  letter-spacing: -0.05em;
}

.notice-card > p:not(.notice-kicker) {
  margin: 10px auto 20px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.notice-actions {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.game-footer {
  min-height: 34px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin: 13px 3px 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.game-footer p {
  margin: 0;
}

.gesture-hint {
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.gesture-icon {
  font-size: 16px;
  line-height: 1;
}

.page-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 19px;
  color: rgba(94, 96, 88, 0.64);
  font-size: 9px;
  letter-spacing: 0.03em;
}

.footer-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@keyframes page-arrive {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes tile-spawn {
  from {
    opacity: 0;
    transform: scale(0.62);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes tile-merge {
  0% {
    transform: scale(1);
  }
  52% {
    transform: scale(1.16);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes score-rise {
  0% {
    opacity: 0;
    transform: translate(-50%, 7px) scale(0.82);
  }
  20% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -30px) scale(1);
  }
}

@keyframes notice-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes card-arrive {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 480px) {
  body {
    align-items: start;
    padding-top: 24px;
  }

  .hero {
    align-items: center;
    margin-inline: 6px;
  }

  .scoreboard {
    gap: 5px;
  }

  .score-box {
    min-width: 68px;
    padding: 9px 9px 8px;
  }

  .score-box strong {
    min-width: 46px;
  }

  .keyboard-hint {
    display: none;
  }

  .toolbar {
    justify-content: flex-start;
  }

  .game-footer {
    align-items: center;
  }

  .page-footer {
    flex-wrap: wrap;
  }
}

@media (max-width: 350px) {
  .tagline {
    max-width: 150px;
  }

  .button {
    padding-inline: 11px;
  }

  .gesture-hint {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="hero">
        <div class="intro">
          <p class="eyebrow"><span aria-hidden="true"></span>MINI GAME · 2048</p>
          <h1>2048</h1>
          <p class="tagline">合并相同的数字，看看你能走多远。</p>
        </div>

        <div class="scoreboard" aria-label="本局信息">
          <div class="score-box score-main" id="scoreBox">
            <span class="score-label">得分</span>
            <strong id="scoreValue">0</strong>
            <span class="score-gain-layer" id="scoreGainLayer" aria-hidden="true"></span>
          </div>
          <div class="score-box">
            <span class="score-label">最高分</span>
            <strong id="bestValue">0</strong>
          </div>
        </div>
      </header>

      <main class="game-card">
        <div class="toolbar">
          <div class="actions">
            <button class="button button-primary" id="newGameButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" />
              </svg>
              新游戏
            </button>
            <button class="button button-quiet" id="undoButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6" />
              </svg>
              撤销
            </button>
          </div>

          <div class="keyboard-hint" aria-hidden="true">
            <span class="key-cluster">
              <kbd>W</kbd>
              <span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
            </span>
            <span class="hint-copy">移动数字</span>
          </div>
        </div>

        <div class="board-frame">
          <div
            class="board"
            id="board"
            role="application"
            aria-label="2048 游戏棋盘。使用方向键或 WASD 移动，手机上可以滑动。"
          >
            <div class="grid-background" id="gridBackground" aria-hidden="true"></div>
            <div class="tile-layer" id="tileLayer" aria-hidden="true"></div>

            <div class="notice" id="notice" hidden>
              <div class="notice-card">
                <p class="notice-kicker" id="noticeKicker">恭喜</p>
                <h2 id="noticeTitle">合出了 2048</h2>
                <p id="noticeCopy">漂亮！还可以继续挑战更高的数字。</p>
                <div class="notice-actions">
                  <button class="button button-primary" id="noticePrimary" type="button">
                    继续挑战
                  </button>
                  <button class="button button-light" id="noticeSecondary" type="button">
                    重新开始
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="game-footer">
          <p id="statusText">合并数字，解锁 2048。</p>
          <p class="gesture-hint">
            <span class="gesture-icon" aria-hidden="true">↔</span>
            方向键或滑动棋盘
          </p>
        </div>
      </main>

      <footer class="page-footer">
        <span>每次移动都会出现一个新数字</span>
        <span class="footer-dot" aria-hidden="true"></span>
        <span>相同数字只能合并一次</span>
      </footer>
    </div>

    <p class="sr-only" id="liveRegion" aria-live="polite"></p>
    <script>
(function (root, factory) {
  const api = factory();

  if (typeof module === "object" && module.exports) {
    module.exports = api;
  }

  root.Game2048Core = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const SIZE = 4;

  function createEmptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function cloneBoard(board) {
    return board.map((row) =>
      row.map((tile) => (tile ? { ...tile } : null))
    );
  }

  function flattenBoard(board) {
    const tiles = [];

    for (let row = 0; row < SIZE; row += 1) {
      for (let col = 0; col < SIZE; col += 1) {
        if (board[row][col]) {
          tiles.push({ ...board[row][col] });
        }
      }
    }

    return tiles;
  }

  function boardFromTiles(tiles) {
    const board = createEmptyBoard();

    for (const tile of tiles) {
      if (
        tile &&
        Number.isInteger(tile.row) &&
        Number.isInteger(tile.col) &&
        tile.row >= 0 &&
        tile.row < SIZE &&
        tile.col >= 0 &&
        tile.col < SIZE
      ) {
        board[tile.row][tile.col] = {
          ...tile,
          merged: Boolean(tile.merged),
          spawned: Boolean(tile.spawned),
        };
      }
    }

    return board;
  }

  function getLineCoordinates(direction, line) {
    const forward = [0, 1, 2, 3];
    const reverse = [3, 2, 1, 0];

    if (direction === "left") {
      return forward.map((col) => [line, col]);
    }

    if (direction === "right") {
      return reverse.map((col) => [line, col]);
    }

    if (direction === "up") {
      return forward.map((row) => [row, line]);
    }

    if (direction === "down") {
      return reverse.map((row) => [row, line]);
    }

    throw new Error(`Unknown direction: ${direction}`);
  }

  function moveBoard(board, direction) {
    if (!["left", "right", "up", "down"].includes(direction)) {
      throw new Error(`Unknown direction: ${direction}`);
    }

    const nextBoard = createEmptyBoard();
    const merges = [];
    let scoreGain = 0;
    let moved = false;

    for (let line = 0; line < SIZE; line += 1) {
      const coordinates = getLineCoordinates(direction, line);
      const tiles = coordinates
        .map(([row, col]) => {
          const tile = board[row][col];
          return tile ? { tile, row, col } : null;
        })
        .filter(Boolean);
      const output = [];

      for (const item of tiles) {
        const previous = output[output.length - 1];

        if (
          previous &&
          !previous.mergedThisTurn &&
          previous.tile.value === item.tile.value
        ) {
          const mergedValue = item.tile.value * 2;
          previous.tile = {
            ...previous.tile,
            value: mergedValue,
            merged: true,
            spawned: false,
          };
          previous.mergedThisTurn = true;
          scoreGain += mergedValue;
          moved = true;
          merges.push({
            survivorId: previous.tile.id,
            consumedId: item.tile.id,
            row: previous.tile.row,
            col: previous.tile.col,
            value: mergedValue,
          });
          continue;
        }

        output.push({
          tile: {
            ...item.tile,
            row: coordinates[output.length][0],
            col: coordinates[output.length][1],
            merged: false,
            spawned: false,
          },
          mergedThisTurn: false,
          originalRow: item.row,
          originalCol: item.col,
        });
      }

      output.forEach((entry, index) => {
        const [row, col] = coordinates[index];
        const tile = {
          ...entry.tile,
          row,
          col,
        };

        if (entry.originalRow !== row || entry.originalCol !== col) {
          moved = true;
        }

        nextBoard[row][col] = tile;
      });
    }

    return {
      board: nextBoard,
      merges,
      scoreGain,
      moved,
    };
  }

  function getEmptyCells(board) {
    const cells = [];

    for (let row = 0; row < SIZE; row += 1) {
      for (let col = 0; col < SIZE; col += 1) {
        if (!board[row][col]) {
          cells.push({ row, col });
        }
      }
    }

    return cells;
  }

  function addRandomTile(board, options = {}) {
    const random = options.random || Math.random;
    const id = options.id || `${Date.now().toString(36)}-${Math.random()}`;
    const emptyCells = getEmptyCells(board);

    if (emptyCells.length === 0) {
      return null;
    }

    const cell = emptyCells[Math.floor(random() * emptyCells.length)];
    const tile = {
      id,
      value: random() < 0.9 ? 2 : 4,
      row: cell.row,
      col: cell.col,
      merged: false,
      spawned: true,
    };

    board[cell.row][cell.col] = tile;
    return tile;
  }

  function hasAvailableMoves(board) {
    if (getEmptyCells(board).length > 0) {
      return true;
    }

    for (let row = 0; row < SIZE; row += 1) {
      for (let col = 0; col < SIZE; col += 1) {
        const value = board[row][col] && board[row][col].value;

        if (
          (col + 1 < SIZE &&
            board[row][col + 1] &&
            board[row][col + 1].value === value) ||
          (row + 1 < SIZE &&
            board[row + 1][col] &&
            board[row + 1][col].value === value)
        ) {
          return true;
        }
      }
    }

    return false;
  }

  function hasWon(board) {
    return flattenBoard(board).some((tile) => tile.value >= 2048);
  }

  function getHighestTile(board) {
    return flattenBoard(board).reduce(
      (highest, tile) => Math.max(highest, tile.value),
      0
    );
  }

  return {
    SIZE,
    addRandomTile,
    boardFromTiles,
    cloneBoard,
    createEmptyBoard,
    flattenBoard,
    getEmptyCells,
    getHighestTile,
    hasAvailableMoves,
    hasWon,
    moveBoard,
  };
});

    <script>
(function () {
  "use strict";

  const Core = window.Game2048Core;
  const STORAGE_KEY = "mini-2048-state-v1";
  const MAX_HISTORY = 10;

  const elements = {
    board: document.querySelector("#board"),
    tileLayer: document.querySelector("#tileLayer"),
    gridBackground: document.querySelector("#gridBackground"),
    score: document.querySelector("#scoreValue"),
    best: document.querySelector("#bestValue"),
    scoreGainLayer: document.querySelector("#scoreGainLayer"),
    newGame: document.querySelector("#newGameButton"),
    undo: document.querySelector("#undoButton"),
    notice: document.querySelector("#notice"),
    noticeKicker: document.querySelector("#noticeKicker"),
    noticeTitle: document.querySelector("#noticeTitle"),
    noticeCopy: document.querySelector("#noticeCopy"),
    noticePrimary: document.querySelector("#noticePrimary"),
    noticeSecondary: document.querySelector("#noticeSecondary"),
    status: document.querySelector("#statusText"),
    live: document.querySelector("#liveRegion"),
  };

  const state = {
    board: Core.createEmptyBoard(),
    score: 0,
    best: 0,
    won: false,
    keepPlaying: false,
    moves: 0,
    history: [],
    noticeType: null,
  };

  const tilesById = new Map();
  let tileCounter = 0;
  let pointerStart = null;
  let moveInProgress = false;
  let activeConsumedTiles = new Set();

  function createTileId() {
    tileCounter += 1;
    return `${Date.now().toString(36)}-${tileCounter.toString(36)}`;
  }

  function randomId() {
    return createTileId();
  }

  function formatNumber(value) {
    return new Intl.NumberFormat("zh-CN").format(value);
  }

  function makeGridBackground() {
    const fragment = document.createDocumentFragment();

    for (let index = 0; index < Core.SIZE * Core.SIZE; index += 1) {
      const cell = document.createElement("div");
      cell.className = "grid-cell";
      fragment.append(cell);
    }

    elements.gridBackground.replaceChildren(fragment);
  }

  function clampToBoard(tile) {
    return {
      ...tile,
      row: Math.max(0, Math.min(Core.SIZE - 1, Number(tile.row))),
      col: Math.max(0, Math.min(Core.SIZE - 1, Number(tile.col))),
    };
  }

  function isValidValue(value) {
    return (
      Number.isInteger(value) &&
      value >= 2 &&
      value <= 2 ** 31 &&
      (value & (value - 1)) === 0
    );
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return false;
      }

      const saved = JSON.parse(raw);

      if (
        saved.version !== 1 ||
        !Array.isArray(saved.tiles) ||
        !Number.isFinite(saved.score) ||
        !Number.isFinite(saved.best)
      ) {
        return false;
      }

      const seen = new Set();
      const tiles = [];

      for (const rawTile of saved.tiles) {
        if (
          !rawTile ||
          typeof rawTile.id !== "string" ||
          !isValidValue(rawTile.value) ||
          !Number.isInteger(rawTile.row) ||
          !Number.isInteger(rawTile.col)
        ) {
          return false;
        }

        const tile = clampToBoard(rawTile);
        const position = `${tile.row}:${tile.col}`;

        if (seen.has(position)) {
          return false;
        }

        seen.add(position);
        tiles.push({
          id: tile.id,
          value: tile.value,
          row: tile.row,
          col: tile.col,
          merged: false,
          spawned: false,
        });
      }

      state.board = Core.boardFromTiles(tiles);
      state.score = Math.max(0, Math.floor(saved.score));
      state.best = Math.max(state.score, Math.floor(saved.best));
      state.won = Boolean(saved.won);
      state.keepPlaying = Boolean(saved.keepPlaying);
      state.moves = Number.isInteger(saved.moves) ? saved.moves : 0;
      state.history = [];
      return tiles.length > 0;
    } catch (error) {
      console.warn("无法读取游戏存档：", error);
      return false;
    }
  }

  function saveState() {
    try {
      const payload = {
        version: 1,
        tiles: Core.flattenBoard(state.board).map((tile) => ({
          id: tile.id,
          value: tile.value,
          row: tile.row,
          col: tile.col,
        })),
        score: state.score,
        best: state.best,
        won: state.won,
        keepPlaying: state.keepPlaying,
        moves: state.moves,
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (error) {
      console.warn("无法保存游戏进度：", error);
    }
  }

  function getTileMetrics(tile) {
    const styles = getComputedStyle(elements.board);
    const gap = Number.parseFloat(styles.getPropertyValue("--gap")) || 0;
    const layerWidth = elements.tileLayer.clientWidth;
    const layerHeight = elements.tileLayer.clientHeight;
    const cellWidth = (layerWidth - gap * (Core.SIZE - 1)) / Core.SIZE;
    const cellHeight = (layerHeight - gap * (Core.SIZE - 1)) / Core.SIZE;

    return {
      left: tile.col * (cellWidth + gap),
      top: tile.row * (cellHeight + gap),
      width: cellWidth,
      height: cellHeight,
    };
  }

  function applyTileGeometry(element, tile) {
    const metrics = getTileMetrics(tile);
    element.style.left = `${metrics.left}px`;
    element.style.top = `${metrics.top}px`;
    element.style.width = `${metrics.width}px`;
    element.style.height = `${metrics.height}px`;
  }

  function setTileFontSize(element, value) {
    element.classList.remove("size-small", "size-medium", "size-tiny");

    if (value >= 10000) {
      element.classList.add("size-tiny");
    } else if (value >= 1000) {
      element.classList.add("size-medium");
    } else {
      element.classList.add("size-small");
    }
  }

  function updateTileElement(element, tile) {
    element.dataset.value = String(tile.value);
    element.textContent = formatNumber(tile.value);
    element.classList.toggle("higher", tile.value > 2048);
    setTileFontSize(element, tile.value);
    applyTileGeometry(element, tile);
  }

  function createTileElement(tile) {
    const element = document.createElement("div");
    element.className = "tile";
    element.dataset.id = tile.id;
    updateTileElement(element, tile);
    element.classList.add("spawn");
    elements.tileLayer.append(element);
    tilesById.set(tile.id, element);
    return element;
  }

  function animateConsumedTiles(merges) {
    for (const merge of merges) {
      const element = tilesById.get(merge.consumedId);

      if (!element) {
        continue;
      }

      activeConsumedTiles.add(merge.consumedId);
      tilesById.delete(merge.consumedId);
      element.classList.add("consumed");
      element.style.left = element.style.left;
      element.style.top = element.style.top;

      window.setTimeout(() => {
        element.remove();
        activeConsumedTiles.delete(merge.consumedId);
      }, 130);
    }
  }

  function renderBoard(options = {}) {
    const { merges = [], skipAnimation = false } = options;
    const currentTiles = Core.flattenBoard(state.board);
    const currentIds = new Set(currentTiles.map((tile) => tile.id));

    if (merges.length > 0 && !skipAnimation) {
      animateConsumedTiles(merges);
    }

    for (const tile of currentTiles) {
      let element = tilesById.get(tile.id);
      const isNewElement = !element;

      if (!element) {
        element = createTileElement(tile);
      } else {
        updateTileElement(element, tile);
      }

      if (!isNewElement && tile.merged && !skipAnimation) {
        element.classList.remove("merged");
        void element.offsetWidth;
        element.classList.add("merged");
      }
    }

    for (const [id, element] of tilesById.entries()) {
      if (!currentIds.has(id)) {
        element.remove();
        tilesById.delete(id);
      }
    }

    for (const id of activeConsumedTiles) {
      if (!currentIds.has(id) && !tilesById.has(id)) {
        const orphan = elements.tileLayer.querySelector(`[data-id="${CSS.escape(id)}"]`);
        if (orphan && !orphan.classList.contains("consumed")) {
          orphan.remove();
        }
      }
    }
  }

  function updateStats() {
    elements.score.textContent = formatNumber(state.score);
    elements.best.textContent = formatNumber(state.best);
    elements.undo.disabled = state.history.length === 0;
  }

  function announce(message) {
    elements.live.textContent = "";
    window.setTimeout(() => {
      elements.live.textContent = message;
    }, 20);
  }

  function updateStatus(message) {
    elements.status.textContent =
      message ||
      (state.moves === 0
        ? "合并数字，解锁 2048。"
        : `已移动 ${state.moves} 次 · 最大数字 ${Core.getHighestTile(state.board)}`);
  }

  function showScoreGain(points) {
    if (points <= 0) {
      return;
    }

    const gain = document.createElement("span");
    gain.className = "score-gain";
    gain.textContent = `+${formatNumber(points)}`;
    elements.scoreGainLayer.append(gain);
    gain.addEventListener("animationend", () => gain.remove(), { once: true });
  }

  function clearTileElements() {
    for (const element of tilesById.values()) {
      element.remove();
    }

    tilesById.clear();
    activeConsumedTiles.clear();
    elements.tileLayer.replaceChildren();
  }

  function hideNotice() {
    state.noticeType = null;
    elements.notice.hidden = true;
  }

  function showNotice(type) {
    state.noticeType = type;

    if (type === "won") {
      elements.noticeKicker.textContent = "里程碑达成";
      elements.noticeTitle.textContent = "合出了 2048";
      elements.noticeCopy.textContent = "漂亮！还可以继续挑战更高的数字。";
      elements.noticePrimary.textContent = "继续挑战";
      elements.noticeSecondary.textContent = "重新开始";
    } else {
      elements.noticeKicker.textContent = "本局结束";
      elements.noticeTitle.textContent = "没有可移动的数字了";
      elements.noticeCopy.textContent = "再试一次，或者回到上一步重新选择路线。";
      elements.noticePrimary.textContent = "再玩一局";
      elements.noticeSecondary.textContent = "撤销上一步";
      elements.noticeSecondary.disabled = state.history.length === 0;
    }

    elements.notice.hidden = false;
    elements.noticePrimary.focus({ preventScroll: true });
  }

  function checkBoardState() {
    const available = Core.hasAvailableMoves(state.board);

    if (state.won && !state.keepPlaying) {
      showNotice("won");
      return;
    }

    if (!available) {
      showNotice("gameover");
      announce("游戏结束，没有可移动的数字了。");
      return;
    }

    hideNotice();
  }

  function snapshotState() {
    return {
      board: Core.cloneBoard(state.board),
      score: state.score,
      won: state.won,
      keepPlaying: state.keepPlaying,
      moves: state.moves,
    };
  }

  function startNewGame() {
    state.board = Core.createEmptyBoard();
    state.score = 0;
    state.won = false;
    state.keepPlaying = false;
    state.moves = 0;
    state.history = [];
    hideNotice();
    clearTileElements();
    Core.addRandomTile(state.board, { id: randomId() });
    Core.addRandomTile(state.board, { id: randomId() });
    renderBoard({ skipAnimation: false });
    updateStats();
    updateStatus();
    saveState();
    announce("新游戏已开始。");
    elements.board.focus({ preventScroll: true });
  }

  function undoMove() {
    const snapshot = state.history.pop();

    if (!snapshot) {
      return;
    }

    state.board = Core.cloneBoard(snapshot.board);
    state.score = snapshot.score;
    state.won = snapshot.won;
    state.keepPlaying = snapshot.keepPlaying;
    state.moves = snapshot.moves;
    clearTileElements();
    hideNotice();
    renderBoard({ skipAnimation: true });
    updateStats();
    updateStatus("已撤销上一步。");
    saveState();
    announce("已撤销上一步。");
  }

  function processMove(direction) {
    if (moveInProgress || !elements.notice.hidden) {
      return;
    }

    const result = Core.moveBoard(state.board, direction);

    if (!result.moved) {
      announce("这个方向暂时不能移动。");
      return;
    }

    moveInProgress = true;
    state.history.push(snapshotState());

    if (state.history.length > MAX_HISTORY) {
      state.history.shift();
    }

    const wasWon = state.won;
    state.board = result.board;
    state.score += result.scoreGain;
    state.best = Math.max(state.best, state.score);
    state.moves += 1;

    if (!wasWon && Core.hasWon(state.board)) {
      state.won = true;
    }

    Core.addRandomTile(state.board, { id: randomId() });
    renderBoard({ merges: result.merges });
    showScoreGain(result.scoreGain);
    updateStats();
    updateStatus();

    if (result.merges.length > 0) {
      announce(
        `合并成功，获得 ${result.scoreGain} 分。当前得分 ${state.score}。`
      );
    }

    window.setTimeout(() => {
      moveInProgress = false;
      checkBoardState();
    }, 150);

    saveState();
  }

  function handleKeyboard(event) {
    if (event.altKey || event.ctrlKey || event.metaKey) {
      return;
    }

    const keyMap = {
      ArrowLeft: "left",
      ArrowRight: "right",
      ArrowUp: "up",
      ArrowDown: "down",
      a: "left",
      A: "left",
      d: "right",
      D: "right",
      w: "up",
      W: "up",
      s: "down",
      S: "down",
    };
    const direction = keyMap[event.key];

    if (!direction) {
      return;
    }

    event.preventDefault();
    processMove(direction);
  }

  function handlePointerDown(event) {
    if (event.pointerType === "mouse" && event.button !== 0) {
      return;
    }

    pointerStart = {
      x: event.clientX,
      y: event.clientY,
      pointerId: event.pointerId,
    };
    elements.board.setPointerCapture?.(event.pointerId);
  }

  function handlePointerUp(event) {
    if (!pointerStart || pointerStart.pointerId !== event.pointerId) {
      return;
    }

    const deltaX = event.clientX - pointerStart.x;
    const deltaY = event.clientY - pointerStart.y;
    const minimumDistance = 24;
    pointerStart = null;

    if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < minimumDistance) {
      return;
    }

    if (Math.abs(deltaX) > Math.abs(deltaY)) {
      processMove(deltaX > 0 ? "right" : "left");
    } else {
      processMove(deltaY > 0 ? "down" : "up");
    }
  }

  function handleNoticeAction(action) {
    if (state.noticeType === "won" && action === "primary") {
      state.keepPlaying = true;
      hideNotice();
      saveState();
      updateStatus("继续挑战更高数字。");
      elements.board.focus({ preventScroll: true });
      return;
    }

    if (state.noticeType === "won" && action === "secondary") {
      startNewGame();
      return;
    }

    if (state.noticeType === "gameover" && action === "secondary") {
      undoMove();
      return;
    }

    startNewGame();
  }

  function bindEvents() {
    document.addEventListener("keydown", handleKeyboard);
    elements.board.addEventListener("pointerdown", handlePointerDown);
    elements.board.addEventListener("pointerup", handlePointerUp);
    elements.board.addEventListener("pointercancel", () => {
      pointerStart = null;
    });
    elements.newGame.addEventListener("click", startNewGame);
    elements.undo.addEventListener("click", undoMove);
    elements.noticePrimary.addEventListener("click", () => {
      handleNoticeAction("primary");
    });
    elements.noticeSecondary.addEventListener("click", () => {
      handleNoticeAction("secondary");
    });

    const resizeObserver = new ResizeObserver(() => {
      elements.tileLayer.classList.add("is-resizing");

      for (const tile of Core.flattenBoard(state.board)) {
        const element = tilesById.get(tile.id);
        if (element) {
          applyTileGeometry(element, tile);
        }
      }

      requestAnimationFrame(() => {
        elements.tileLayer.classList.remove("is-resizing");
      });
    });
    resizeObserver.observe(elements.board);
  }

  function initialize() {
    makeGridBackground();
    const loaded = loadState();

    if (!loaded) {
      state.board = Core.createEmptyBoard();
      state.score = 0;
      state.won = false;
      state.keepPlaying = false;
      state.moves = 0;
      Core.addRandomTile(state.board, { id: randomId() });
      Core.addRandomTile(state.board, { id: randomId() });
      saveState();
    }

    runWithLayout(() => {
      renderBoard({ skipAnimation: loaded });
      updateStats();
      updateStatus();
      bindEvents();

      if (state.won && !state.keepPlaying) {
        showNotice("won");
      } else if (!Core.hasAvailableMoves(state.board)) {
        showNotice("gameover");
      }
    });
  }

  function runWithLayout(callback) {
    requestAnimationFrame(() => {
      requestAnimationFrame(callback);
    });
  }

  initialize();
})();
